name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Reset project
        run: |
          rm -rf android lib test pubspec.yaml
          flutter create . --org com.hassanshukair --project-name alshukairi_app --platforms android

      - name: Fix Kotlin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          if grep -q "ext.kotlin_version" android/build.gradle 2>/dev/null; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          fi
          grep -n "kotlin" android/settings.gradle || true

      - name: Arabic app name
        run: |
          sed -i 's|android:label="alshukairi_app"|android:label="الشقيري للمواد التجارية"|' android/app/src/main/AndroidManifest.xml

      - name: Write pubspec.yaml
        run: |
          cat > pubspec.yaml << 'PUBEOF'
          name: alshukairi_app
          description: AlShukairi app
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.7.0
          flutter:
            uses-material-design: true
          PUBEOF

      - name: Write lib/main.dart
