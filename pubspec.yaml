name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: توليد مشروع أندرويد كامل من الصفر
        run: |
          rm -rf android
          flutter create . --org com.hassanshukair --project-name alshukairi_app --platforms android

      - name: ضبط اسم التطبيق بالعربي
        run: |
          sed -i 's/android:label="alshukairi_app"/android:label="الشقيري للمواد التجارية"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: shukairi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
